name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    # CoreLocation symbols live behind #if canImport(CoreLocation), so the
    # published documentation is built on macOS to include them.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: SwiftyLab/setup-swift@v1.14.2
        with:
          swift-version: "6.4"
      - name: Cache SwiftPM build products
        uses: actions/cache@v6.1.0
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-docs-macos-26-swift6.4-${{ hashFiles('Package.resolved') }}
      - name: Build Documentation
        run: |
          swift package --allow-writing-to-directory docs \
            generate-documentation --target SwiftCIFP \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path SwiftCIFP \
            --output-path docs
      - name: Create Redirect
        run: |
          echo '<html><head><meta http-equiv="refresh" content="0; url=/SwiftCIFP/documentation/swiftcifp/"></head></html>' > docs/index.html
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
